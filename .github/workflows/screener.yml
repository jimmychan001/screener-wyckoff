name: Screener diario Wyckoff

on:
  schedule:
    # Lunes a viernes 22:17 UTC (≈ 19:17 en Chile en horario de verano), después del cierre de EE. UU.
    - cron: "17 22 * * 1-5"
  workflow_dispatch: {}   # botón "Run workflow" para correrlo a mano

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar screener
        run: python screener.py

      - name: Guardar reporte en el repositorio
        id: commit
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add -A reports
          # ¿cambiaron las señales respecto a la última ejecución?
          if [ -f reports/signals.txt ] && ! git diff --cached --quiet -- reports/signals.txt; then
            echo "new_signals=true" >> "$GITHUB_OUTPUT"
          fi
          git diff --cached --quiet || git commit -m "Reporte $(date -u +%F)"
          git push

      - name: Avisar señales nuevas (crea un issue → te llega notificación)
        if: steps.commit.outputs.new_signals == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue create --title "🔔 Señales Wyckoff $(date -u +%F)" --body-file reports/signals.txt
